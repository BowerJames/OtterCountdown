# Recipe for training a GRPO model on an A100 GPU

# Dataset
dataset_name: "jimbowyer123/countdown"
split: "train"
test_split: 0.01

# Base Model
model_name: "meta-llama/meta-Llama-3.1-8B-Instruct"
max_seq_len: 2048
load_in_4bit: true
fast_inference: true
gpu_memory_utilization: 0.5

# Peft Model
lora_rank: 16
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
lora_alpha: 16
use_gradient_checkpointing: "unsloth"
random_state: 42

# Trainign Args
use_vllm: true
per_device_train_batch_size: 1
num_generations: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
adam_beta1: 0.9
adam_beta2: 0.999
warmup_ratio: 0.1
lr_scheduler_type: cosine
optim: "paged_adamw_8bit"
logging_steps: 1
bf16: true
fp16: false
max_prompt_length: 256
max_completion_length: 1024
max_steps: 200
eval_steps: 200
num_train_epochs: 1
max_grad_norm: 1.0
output_dir: "unsloth_grpo"
overwrite_output_dir: true
push_to_hub: false
report_to:
  - "wandb"
seed: 42




